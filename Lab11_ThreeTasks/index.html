<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b13" />
  <title>Лабораторная №11 — React: Props & State</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b13;
      --surface: #111827;
      --surface-2: #172235;
      --line: rgba(160, 180, 215, .14);
      --text: #f3f6ff;
      --muted: #9aa8c1;
      --purple: #9b8cff;
      --cyan: #63e6d2;
      --orange: #ff9b45;
      --green: #67e8a5;
      --red: #fb7185;
      --shadow: 0 22px 70px rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 10% -5%, rgba(102,79,220,.24), transparent 34%),
        radial-gradient(ellipse at 100% 13%, rgba(22,167,160,.13), transparent 27%),
        radial-gradient(ellipse at 75% 100%, rgba(232,127,49,.08), transparent 28%), var(--bg);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .shell { width: min(1220px, calc(100% - 38px)); margin: 0 auto; padding: 34px 0 54px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:10px; color:#dbe4fa; font-size:12px; font-weight:850; letter-spacing:.15em; text-transform:uppercase; }
    .brand-mark { width:31px; height:31px; display:grid; place-items:center; border-radius:10px; color:#090d18; background:linear-gradient(135deg,#9d8bff,#5fe6d2); font-size:17px; box-shadow:0 6px 22px rgba(117,119,255,.23); }
    .top-status { display:flex; align-items:center; gap:8px; border:1px solid rgba(103,232,165,.18); background:rgba(103,232,165,.06); color:#a9f4c8; padding:8px 12px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.04em; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
    .hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:28px; padding:34px; margin-bottom:20px; border:1px solid rgba(160,180,215,.16); border-radius:27px; background:linear-gradient(116deg,rgba(29,34,62,.96),rgba(16,28,44,.94) 58%,rgba(16,49,53,.76)); box-shadow:var(--shadow); }
    .hero:before { content:""; position:absolute; width:320px; height:320px; right:10%; top:-210px; border:1px solid rgba(125,224,220,.18); border-radius:50%; box-shadow:0 0 0 35px rgba(125,224,220,.025),0 0 0 70px rgba(125,224,220,.02); pointer-events:none; }
    .hero:after { content:""; position:absolute; width:180px; height:180px; right:17%; bottom:-145px; border-radius:50%; background:rgba(137,118,255,.18); filter:blur(35px); pointer-events:none; }
    .hero-content,.hero-aside { position:relative; z-index:1; }
    .eyebrow { display:flex; align-items:center; gap:9px; color:var(--cyan); font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
    .eyebrow-line { width:23px; height:1px; background:var(--cyan); }
    h1 { margin:13px 0 12px; max-width:760px; font-size:clamp(34px,5.2vw,61px); line-height:.99; letter-spacing:-.055em; }
    h1 span { color:#a99cff; }
    .hero-copy { max-width:690px; margin:0; color:#b3bfd4; font-size:14px; line-height:1.75; }
    .hero-aside { width:210px; padding:18px; border-radius:19px; border:1px solid rgba(255,255,255,.12); background:rgba(6,13,27,.42); backdrop-filter:blur(12px); }
    .hero-aside-label { color:#9eabc4; font-size:10px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    .hero-aside-number { margin:7px 0 3px; font-size:42px; font-weight:900; letter-spacing:-.06em; }
    .hero-aside-note { color:#abb8ce; font-size:11px; line-height:1.55; }
    .hero-pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
    .pill { display:inline-flex; align-items:center; gap:7px; padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.035); color:#c9d4e8; font-size:11px; font-weight:750; }
    .pill strong { color:#fff; }
    .architecture { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
    .architecture-item { display:flex; align-items:center; gap:12px; min-width:0; padding:13px 15px; border:1px solid var(--line); border-radius:15px; background:rgba(15,22,37,.72); }
    .architecture-icon { width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border-radius:11px; background:rgba(155,140,255,.13); color:#c6bcff; font-size:15px; font-weight:900; }
    .architecture-item:nth-child(2) .architecture-icon { background:rgba(99,230,210,.1); color:var(--cyan); }
    .architecture-item:nth-child(3) .architecture-icon { background:rgba(255,155,69,.11); color:var(--orange); }
    .architecture-title { font-size:12px; font-weight:850; }
    .architecture-sub { margin-top:3px; color:var(--muted); font-size:10px; }
    .tabs { display:flex; gap:8px; padding:7px; margin-bottom:17px; border:1px solid var(--line); border-radius:18px; background:rgba(12,18,31,.88); box-shadow:0 12px 36px rgba(0,0,0,.15); }
    .tab { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; padding:13px 14px; border:1px solid transparent; border-radius:12px; background:transparent; color:#9eabc2; font-size:12px; font-weight:850; transition:background .2s,color .2s,transform .2s,border .2s; }
    .tab:hover { color:#fff; background:rgba(255,255,255,.045); transform:translateY(-1px); }
    .tab.active { color:#fff; background:linear-gradient(120deg,rgba(123,105,239,.28),rgba(61,119,149,.19)); border-color:rgba(157,140,255,.28); }
    .tab-number { display:grid; place-items:center; width:25px; height:25px; border-radius:8px; background:rgba(255,255,255,.07); color:#bbc7dd; font-size:10px; }
    .tab:nth-child(3) .tab-number { color:#251507; background:var(--orange); box-shadow:0 0 16px rgba(255,155,69,.3); }
    .tab:nth-child(3).active { border-color:rgba(255,155,69,.36); background:linear-gradient(120deg,rgba(255,155,69,.16),rgba(135,76,35,.12)); }
    .panel { padding:26px; border:1px solid var(--line); border-radius:23px; background:linear-gradient(145deg,rgba(17,25,42,.97),rgba(12,19,33,.97)); box-shadow:var(--shadow); }
    .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:23px; }
    .section-kicker { margin-bottom:7px; color:var(--cyan); font-size:10px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h2 { margin:0 0 7px; font-size:25px; letter-spacing:-.035em; }
    h3 { margin:0; font-size:16px; letter-spacing:-.02em; }
    .section-description { margin:0; color:var(--muted); font-size:12px; line-height:1.65; }
    .task-tag { display:inline-flex; align-items:center; gap:7px; flex-shrink:0; padding:8px 11px; border:1px solid var(--line); border-radius:999px; color:#cad5e9; background:rgba(255,255,255,.035); font-size:10px; font-weight:850; white-space:nowrap; }
    .task-tag.orange { border-color:rgba(255,155,69,.28); color:#ffc18e; background:rgba(255,155,69,.08); }
    .muted { color:var(--muted); }
    .small { font-size:11px; }
    .like-stage { position:relative; display:grid; place-items:center; min-height:400px; overflow:hidden; border:1px solid rgba(155,140,255,.15); border-radius:22px; background:radial-gradient(circle at 50% 46%,rgba(101,91,206,.18),transparent 37%),linear-gradient(135deg,rgba(21,30,53,.9),rgba(12,23,37,.9)); }
    .like-stage:before,.like-stage:after { content:""; position:absolute; width:250px; height:250px; border:1px solid rgba(155,140,255,.12); border-radius:50%; pointer-events:none; }
    .like-stage:after { width:330px; height:330px; border-color:rgba(99,230,210,.07); }
    .like-center { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; padding:35px 18px; text-align:center; }
    .like-caption { margin-bottom:13px; color:#cbd6ea; font-size:14px; font-weight:800; }
    .like-button { position:relative; display:grid; place-items:center; width:190px; height:190px; border:1px solid rgba(191,181,255,.4); border-radius:50%; color:#fff; background:radial-gradient(circle at 34% 25%,#b1a4ff,#7864e9 48%,#4b43aa); box-shadow:0 0 0 12px rgba(155,140,255,.06),0 18px 70px rgba(102,85,226,.37),inset 0 3px 15px rgba(255,255,255,.24); transition:transform .2s,box-shadow .2s,filter .2s; }
    .like-button:hover { transform:translateY(-4px) scale(1.025); filter:brightness(1.07); box-shadow:0 0 0 17px rgba(155,140,255,.07),0 24px 78px rgba(102,85,226,.47),inset 0 3px 15px rgba(255,255,255,.27); }
    .like-button:active { transform:scale(.96); }
    .thumb { font-size:91px; line-height:1; filter:drop-shadow(0 8px 9px rgba(22,15,70,.34)); user-select:none; }
    .thumb.bump { animation:thumbPop .42s cubic-bezier(.2,.8,.2,1); }
    @keyframes thumbPop { 0%{transform:scale(.65) rotate(-14deg)} 55%{transform:scale(1.2) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }
    .like-count { margin-top:19px; font-size:47px; font-weight:950; letter-spacing:-.06em; font-variant-numeric:tabular-nums; }
    .like-count-label { color:#a8b5cb; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .like-hint { margin-top:13px; color:#8f9db7; font-size:11px; }
    .like-burst { position:absolute; top:20%; right:12%; color:#b8abff; font-size:17px; font-weight:950; pointer-events:none; animation:burst 1s ease-out forwards; }
    @keyframes burst { 0%{opacity:0;transform:translateY(15px) scale(.7)} 20%{opacity:1} 100%{opacity:0;transform:translateY(-70px) scale(1.25)} }
    .like-actions { display:flex; justify-content:center; gap:9px; margin-top:16px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:11px; padding:10px 14px; color:#fff; font-size:11px; font-weight:850; transition:transform .16s,filter .16s,background .16s; }
    .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
    .btn:active { transform:translateY(0) scale(.98); }
    .btn-primary { background:linear-gradient(120deg,#8978f5,#5d72dc); box-shadow:0 8px 22px rgba(110,100,226,.2); }
    .btn-soft { color:#d3def1; border:1px solid var(--line); background:rgba(255,255,255,.055); }
    .btn-orange { color:#271507; background:linear-gradient(120deg,#ffbd79,#ff9239); box-shadow:0 8px 22px rgba(255,145,54,.16); }
    .btn-danger { color:#ffb7c2; border:1px solid rgba(251,113,133,.2); background:rgba(251,113,133,.09); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .language-layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr); gap:16px; align-items:stretch; }
    .language-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; align-content:start; }
    .language-card { position:relative; overflow:hidden; display:flex; flex-direction:column; gap:11px; min-height:170px; padding:18px; border:1px solid var(--line); border-radius:17px; background:linear-gradient(145deg,rgba(30,42,65,.84),rgba(17,25,41,.9)); text-align:left; color:var(--text); transition:transform .2s,border-color .2s,box-shadow .2s; }
    .language-card:after { content:""; position:absolute; width:110px; height:110px; right:-44px; bottom:-50px; border-radius:50%; background:var(--language-glow,rgba(155,140,255,.2)); filter:blur(18px); opacity:.8; }
    .language-card:hover { transform:translateY(-4px); border-color:rgba(175,164,255,.45); box-shadow:0 13px 30px rgba(0,0,0,.2); }
    .language-card.selected { border-color:var(--language-color,#9b8cff); box-shadow:0 0 0 2px color-mix(in srgb,var(--language-color,#9b8cff) 22%,transparent),0 14px 30px rgba(0,0,0,.2); }
    .language-card-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .language-symbol { width:43px; height:43px; display:grid; place-items:center; border-radius:13px; background:var(--language-bg,rgba(155,140,255,.14)); color:var(--language-color,#b8adff); font-weight:950; font-size:19px; }
    .language-level { color:#aab7cc; font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .language-card h3,.language-card p,.language-card .language-bottom { position:relative; z-index:1; }
    .language-card p { margin:0; color:#aab8ce; font-size:11px; line-height:1.55; }
    .language-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:auto; color:#c6d1e4; font-size:10px; font-weight:800; }
    .language-bottom span:last-child { color:var(--language-color,#b8adff); }
    .course-detail { position:relative; overflow:hidden; padding:22px; border:1px solid rgba(155,140,255,.2); border-radius:19px; background:linear-gradient(150deg,rgba(42,42,81,.57),rgba(15,29,44,.9)); }
    .course-detail.reveal { animation:detailReveal .52s cubic-bezier(.2,.8,.2,1); }
    @keyframes detailReveal { from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(5px)} to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
    .detail-head { display:flex; align-items:center; gap:13px; margin-bottom:16px; }
    .detail-symbol { width:57px; height:57px; display:grid; place-items:center; border-radius:17px; color:var(--language-color,#c4baff); background:var(--language-bg,rgba(155,140,255,.16)); font-size:25px; font-weight:950; }
    .detail-title-wrap { min-width:0; }
    .detail-title-wrap h2 { margin:0 0 4px; font-size:23px; }
    .detail-subtitle { color:#aab8ce; font-size:10px; }
    .detail-copy { margin:0 0 16px; color:#cad4e6; font-size:12px; line-height:1.8; }
    .detail-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:15px 0; }
    .detail-stat { padding:10px; border:1px solid rgba(255,255,255,.08); border-radius:12px; background:rgba(255,255,255,.035); }
    .detail-stat strong { display:block; font-size:15px; }
    .detail-stat span { display:block; margin-top:4px; color:#9aa9c0; font-size:9px; }
    .detail-block-title { margin:16px 0 9px; color:#dce5f6; font-size:10px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .feature-list { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:0; padding:0; list-style:none; }
    .feature-list li { display:flex; align-items:flex-start; gap:7px; color:#b6c4da; font-size:10px; line-height:1.5; }
    .feature-list li:before { content:"✦"; color:var(--language-color,#b8adff); }
    .code-window { margin-top:15px; overflow:hidden; border:1px solid rgba(255,255,255,.1); border-radius:13px; background:#080e19; }
    .code-window-top { display:flex; align-items:center; gap:5px; padding:9px 11px; border-bottom:1px solid rgba(255,255,255,.07); color:#8d9bb2; font-size:9px; }
    .code-dot { width:6px; height:6px; border-radius:50%; background:#ff8585; }.code-dot:nth-child(2){background:#ffd17c}.code-dot:nth-child(3){background:#75dfab}
    .code-window pre { overflow-x:auto; margin:0; padding:13px; color:#c5e7e3; font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre; }
    .journal-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:17px; }
    .journal-stat { padding:14px 15px; border:1px solid var(--line); border-radius:15px; background:linear-gradient(145deg,rgba(31,42,61,.8),rgba(17,26,42,.9)); }
    .journal-stat-label { color:#9eabc1; font-size:10px; }
    .journal-stat-value { margin-top:5px; font-size:24px; font-weight:950; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .journal-stat:nth-child(3) .journal-stat-value { color:var(--orange); }
    .add-student { margin-bottom:17px; padding:18px; border:1px solid rgba(255,155,69,.2); border-radius:17px; background:linear-gradient(120deg,rgba(96,58,30,.16),rgba(24,32,47,.78)); }
    .add-student-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .add-student-head h3 { display:flex; align-items:center; gap:9px; font-size:14px; }
    .add-plus { width:25px; height:25px; display:grid; place-items:center; border-radius:8px; color:#281606; background:var(--orange); font-size:17px; }
    .form-grid { display:grid; grid-template-columns:1.25fr .8fr 1.2fr .55fr .6fr; gap:9px; align-items:end; }
    .field-wrap { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field-label { color:#aab7cc; font-size:9px; font-weight:850; letter-spacing:.06em; text-transform:uppercase; }
    .field { width:100%; min-width:0; color:var(--text); background:#0c1423; border:1px solid rgba(154,174,207,.2); border-radius:10px; padding:10px 11px; font-size:11px; outline:none; }
    .field:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,155,69,.1); }
    .field::placeholder { color:#687891; }
    .form-submit { min-height:37px; white-space:nowrap; }
    .journal-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 11px; }
    .search-field { width:min(310px,100%); }
    .student-list { display:grid; gap:10px; }
    .student-card { display:grid; grid-template-columns:minmax(190px,1.15fr) minmax(145px,1fr) minmax(130px,.7fr) auto; align-items:center; gap:15px; padding:15px; border:1px solid var(--line); border-radius:15px; background:linear-gradient(120deg,rgba(27,39,59,.8),rgba(16,25,41,.88)); animation:rowIn .35s ease both; }
    @keyframes rowIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
    .student-main { display:flex; align-items:center; gap:11px; min-width:0; }
    .student-avatar { width:39px; height:39px; flex:0 0 39px; display:grid; place-items:center; border:1px solid rgba(255,155,69,.22); border-radius:13px; color:#ffc18e; background:rgba(255,155,69,.11); font-size:13px; font-weight:950; }
    .student-name { overflow:hidden; color:#f0f4ff; font-size:12px; font-weight:900; text-overflow:ellipsis; white-space:nowrap; }
    .student-meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
    .student-chip { padding:4px 6px; border:1px solid rgba(255,255,255,.08); border-radius:6px; color:#aab8ce; font-size:9px; }
    .student-marks-label,.average-label { margin-bottom:7px; color:#8f9db5; font-size:9px; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
    .marks { display:flex; flex-wrap:wrap; gap:5px; }
    .mark { min-width:24px; height:24px; display:grid; place-items:center; padding:0 5px; border-radius:7px; color:#b3f3d2; background:rgba(103,232,165,.1); font-size:10px; font-weight:950; }
    .mark.low { color:#ffb4c0; background:rgba(251,113,133,.12); }
    .no-marks { color:#7f8da6; font-size:10px; }
    .average-number { color:#ffd0a4; font-size:22px; font-weight:950; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .student-actions { display:flex; align-items:center; gap:6px; }
    .grade-select { width:58px; padding:9px 7px; }
    .icon-btn { width:34px; height:34px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:9px; color:#aebbd1; background:rgba(255,255,255,.04); }
    .icon-btn:hover { color:#ffabb9; border-color:rgba(251,113,133,.3); background:rgba(251,113,133,.08); }
    .empty { padding:25px; border:1px dashed rgba(160,180,215,.2); border-radius:14px; color:#93a2ba; text-align:center; font-size:12px; }
    .note { display:flex; align-items:flex-start; gap:10px; margin-top:16px; padding:13px 14px; border:1px solid rgba(99,230,210,.13); border-radius:13px; background:rgba(99,230,210,.045); color:#9fb4c5; font-size:10px; line-height:1.6; }
    .note strong { color:#c5fff3; }
    .footer { display:flex; justify-content:space-between; gap:12px; padding:18px 3px 0; color:#697892; font-size:10px; }
    .footer strong { color:#9ba9c1; }
    @media(max-width:900px) {
      .hero { grid-template-columns:1fr; }.hero-aside { width:auto; display:flex; align-items:center; gap:15px; }.hero-aside-number { margin:0; }.hero-aside-note { max-width:220px; }
      .language-layout { grid-template-columns:1fr; }.course-detail { min-height:unset; }
      .form-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }.form-submit { grid-column:span 3; }
      .student-card { grid-template-columns:minmax(180px,1.1fr) minmax(135px,1fr) minmax(100px,.6fr); }.student-actions { grid-column:1/-1; justify-content:flex-end; }
    }
    @media(max-width:650px) {
      .shell { width:calc(100% - 22px); padding-top:17px; }.topline { margin-bottom:15px; }.top-status { font-size:9px; padding:7px 9px; }
      .hero { padding:23px 19px; border-radius:21px; }.hero-copy { font-size:12px; }.hero-aside { padding:12px; }.hero-aside-number { font-size:32px; }
      .architecture { grid-template-columns:1fr; gap:7px; }.architecture-item { padding:10px 12px; }
      .tabs { display:grid; grid-template-columns:1fr; gap:5px; }.tab { justify-content:flex-start; }
      .panel { padding:16px; border-radius:18px; }.section-head { flex-direction:column; gap:11px; }.section-head h2 { font-size:21px; }
      .like-stage { min-height:350px; }.like-button { width:160px; height:160px; }.thumb { font-size:76px; }.like-count { font-size:39px; }
      .language-grid { grid-template-columns:1fr 1fr; }.language-card { min-height:160px; padding:13px; }.language-card p { font-size:10px; }
      .journal-stats { grid-template-columns:repeat(2,1fr); }.journal-stat-value { font-size:21px; }
      .form-grid { grid-template-columns:1fr 1fr; }.form-submit { grid-column:span 2; }
      .student-card { grid-template-columns:1fr 1fr; }.student-main { grid-column:1/-1; }.student-actions { grid-column:1/-1; justify-content:flex-start; }
      .journal-toolbar { align-items:stretch; flex-direction:column; }.search-field { width:100%; }
      .footer { flex-direction:column; }
    }
    @media(max-width:390px) { .language-grid { grid-template-columns:1fr; }.feature-list { grid-template-columns:1fr; }.detail-stats { grid-template-columns:1fr 1fr 1fr; } }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React и Babel загружаются с CDN. Установка Node.js/npm не требуется. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const safeRead = (key, fallback) => {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
      } catch { return fallback; }
    };

    // ЗАДАНИЕ 1. Подпись приходит через props, лайки хранятся в state.
    function LikeButton({ caption }) {
      const [likes, setLikes] = useState(() => Number(safeRead('lab11-likes', 0)) || 0);
      const [pulse, setPulse] = useState(0);
      const [burst, setBurst] = useState(0);
      useEffect(() => { localStorage.setItem('lab11-likes', JSON.stringify(likes)); }, [likes]);
      const addLike = () => { setLikes(value => value + 1); setPulse(value => value + 1); setBurst(value => value + 1); };
      return (
        <div className="like-stage">
          {burst > 0 && <span key={burst} className="like-burst">+1 LIKE</span>}
          <div className="like-center">
            <div className="like-caption">{caption}</div>
            <button className="like-button" onClick={addLike} aria-label="Поставить лайк" title="Нажми, чтобы поставить лайк">
              <span key={pulse} className="thumb bump">👍</span>
            </button>
            <div className="like-count">{likes.toLocaleString('ru-RU')}</div>
            <div className="like-count-label">{likes === 1 ? 'лайк собран' : likes > 1 && likes < 5 ? 'лайка собрано' : 'лайков собрано'}</div>
            <div className="like-hint">Нажми на большой палец — каждый клик добавляет один лайк</div>
            <div className="like-actions">
              <button className="btn btn-soft" onClick={() => setLikes(0)} disabled={likes === 0}>↺ Сбросить счётчик</button>
            </div>
          </div>
        </div>
      );
    }

    const languages = [
      {
        id:'javascript', name:'JavaScript', symbol:'JS', family:'Frontend / Backend', level:'Базовый → профи', color:'#f2d45c', bg:'rgba(242,212,92,.13)', glow:'rgba(242,212,92,.24)',
        short:'Язык интерактивных сайтов, веб-приложений и серверных сервисов.',
        description:'JavaScript оживляет веб-страницы: реагирует на действия пользователя, меняет содержимое без перезагрузки и связывает интерфейс с сервером. На нём построены современные frontend-приложения, а с Node.js он работает и на backend.',
        use:'Интерактивные сайты, интернет-магазины, веб-сервисы, серверные API и приложения реального времени.',
        stats:[['1995','год появления'],['Full stack','экосистема'],['Браузер','среда запуска']],
        features:['Работа с DOM и событиями','Асинхронность: Promise и async/await','Массивы, объекты и функции','React, Vue и Node.js'],
        code:'const button = document.querySelector("button");\nbutton.addEventListener("click", () => {\n  document.body.classList.toggle("active");\n});'
      },
      {
        id:'python', name:'Python', symbol:'Py', family:'Data / AI / Backend', level:'Удобный старт', color:'#79b9f2', bg:'rgba(88,157,230,.14)', glow:'rgba(88,157,230,.24)',
        short:'Понятный язык для автоматизации, анализа данных и искусственного интеллекта.',
        description:'Python известен читаемым синтаксисом и огромной экосистемой библиотек. Он подходит для первых шагов в программировании, автоматизации рутинных задач, научных вычислений, машинного обучения и серверной разработки.',
        use:'Анализ данных, нейросети, автоматизация, парсинг, научные расчёты и backend-сервисы.',
        stats:[['1991','год появления'],['AI / Data','сильные области'],['Кроссплатф.','запуск']],
        features:['Простой и читаемый синтаксис','NumPy, Pandas и Matplotlib','Машинное обучение и AI','Django, Flask и FastAPI'],
        code:'students = ["Алия", "Марат", "Данияр"]\nfor name in students:\n    print(f"Привет, {name}!")'
      },
      {
        id:'cpp', name:'C++', symbol:'C++', family:'Systems / GameDev', level:'Продвинутый', color:'#83a8ff', bg:'rgba(110,145,255,.14)', glow:'rgba(110,145,255,.24)',
        short:'Высокопроизводительный язык для системного ПО, игр и сложных вычислений.',
        description:'C++ даёт разработчику контроль над памятью и производительностью. Язык используют там, где важны скорость, предсказуемость и эффективная работа с ресурсами компьютера.',
        use:'Игровые движки, графика, высоконагруженные приложения, встроенные и системные программы.',
        stats:[['1985','год выпуска'],['High perf.','производительность'],['Native','компиляция']],
        features:['Управление памятью','ООП и шаблоны','STL: контейнеры и алгоритмы','Unreal Engine и системное ПО'],
        code:'#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << "Hello, world!";\n  return 0;\n}'
      },
      {
        id:'java', name:'Java', symbol:'JVM', family:'Enterprise / Android', level:'Средний', color:'#ffad70', bg:'rgba(255,157,91,.14)', glow:'rgba(255,157,91,.24)',
        short:'Платформенно-независимый язык для корпоративных систем и приложений.',
        description:'Java компилируется в байт-код и выполняется виртуальной машиной JVM. Это помогает запускать программы на разных операционных системах. Язык широко применяют в крупных backend-системах и корпоративной разработке.',
        use:'Корпоративные платформы, backend, банковские системы, Android и распределённые сервисы.',
        stats:[['1995','год появления'],['JVM','виртуальная машина'],['Enterprise','экосистема']],
        features:['Строгая статическая типизация','Объектно-ориентированный подход','Многопоточность','Spring и JVM-экосистема'],
        code:'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello, world!");\n  }\n}'
      },
      {
        id:'csharp', name:'C#', symbol:'C#', family:'.NET / GameDev', level:'Средний', color:'#c99aff', bg:'rgba(183,127,244,.14)', glow:'rgba(183,127,244,.24)',
        short:'Современный язык платформы .NET для приложений, сервисов и игр.',
        description:'C# сочетает выразительный синтаксис, строгую типизацию и мощную платформу .NET. Он подходит для desktop- и web-разработки, облачных сервисов и создания игр на Unity.',
        use:'Игры на Unity, веб-сервисы ASP.NET Core, корпоративное ПО и приложения Windows.',
        stats:[['2000','год появления'],['.NET','платформа'],['Unity','игровая среда']],
        features:['LINQ и асинхронность','Объектно-ориентированный код','ASP.NET Core','Разработка игр в Unity'],
        code:'using System;\n\nclass Program {\n  static void Main() {\n    Console.WriteLine("Hello, world!");\n  }\n}'
      },
      {
        id:'go', name:'Go', symbol:'Go', family:'Cloud / Backend', level:'Средний', color:'#70dedf', bg:'rgba(92,218,219,.13)', glow:'rgba(92,218,219,.22)',
        short:'Компилируемый язык для быстрых сетевых и облачных сервисов.',
        description:'Go (Golang) создавался с акцентом на простоту, скорость компиляции и удобную конкурентность. Его часто выбирают для микросервисов, инфраструктурных инструментов и облачных платформ.',
        use:'Микросервисы, DevOps-инструменты, сетевые приложения и cloud-инфраструктура.',
        stats:[['2009','год выпуска'],['Goroutines','конкурентность'],['Cloud','сильная область']],
        features:['Простая модель конкурентности','Goroutines и channels','Быстрая компиляция','Удобен для микросервисов'],
        code:'package main\n\nimport "fmt"\n\nfunc main() {\n  fmt.Println("Hello, world!")\n}'
      }
    ];

    // ЗАДАНИЕ 2. CourseCard получает описание и характеристики языка через props.
    function CourseCard({ course, selected, onSelect }) {
      return (
        <button type="button" className={`language-card ${selected ? 'selected' : ''}`}
          style={{'--language-color':course.color,'--language-bg':course.bg,'--language-glow':course.glow}}
          onClick={() => onSelect(course)} aria-pressed={selected}>
          <div className="language-card-top">
            <span className="language-symbol">{course.symbol}</span>
            <span className="language-level">{course.level}</span>
          </div>
          <h3>{course.name}</h3>
          <p>{course.short}</p>
          <div className="language-bottom"><span>{course.family}</span><span>{selected ? 'Открыто ✓' : 'Изучить ↗'}</span></div>
        </button>
      );
    }

    function CourseDetails({ course }) {
      return (
        <aside key={course.id} className="course-detail reveal" style={{'--language-color':course.color,'--language-bg':course.bg}}>
          <div className="detail-head">
            <div className="detail-symbol">{course.symbol}</div>
            <div className="detail-title-wrap"><div className="section-kicker" style={{color:course.color}}>Профиль технологии</div><h2>{course.name}</h2><div className="detail-subtitle">{course.family} · {course.level}</div></div>
          </div>
          <p className="detail-copy">{course.description}</p>
          <div className="detail-stats">{course.stats.map(([value,label]) => <div className="detail-stat" key={label}><strong>{value}</strong><span>{label}</span></div>)}</div>
          <div className="detail-block-title">Что важно знать</div>
          <ul className="feature-list">{course.features.map(feature => <li key={feature}>{feature}</li>)}</ul>
          <div className="detail-block-title">Где применяется</div>
          <p className="detail-copy" style={{marginBottom:0}}>{course.use}</p>
          <div className="code-window">
            <div className="code-window-top"><i className="code-dot"></i><i className="code-dot"></i><i className="code-dot"></i><span style={{marginLeft:6}}>{course.name.toLowerCase()} · пример кода</span></div>
            <pre>{course.code}</pre>
          </div>
        </aside>
      );
    }

    const initialStudents = [
      { id:1, name:'Алихан Садыков', group:'ПО-21', specialty:'Программное обеспечение', year:'2 курс', age:19, grades:[5,4,5] },
      { id:2, name:'Аружан Нурланова', group:'ПО-21', specialty:'Программное обеспечение', year:'2 курс', age:18, grades:[4,5,5,4] },
      { id:3, name:'Данияр Ермеков', group:'ИС-22', specialty:'Информационные системы', year:'1 курс', age:17, grades:[3,4] }
    ];

    // ЗАДАНИЕ 3. StudentRow получает карточку студента через props.
    // Список студентов и оценки изменяются в родительском компоненте App.
    function StudentRow({ student, onAddGrade, onRemove }) {
      const [grade, setGrade] = useState('5');
      const average = student.grades.length ? student.grades.reduce((sum,value) => sum + value,0) / student.grades.length : 0;
      const initials = student.name.trim().split(/\s+/).slice(0,2).map(part => part[0] || '').join('').toUpperCase();
      return (
        <article className="student-card">
          <div className="student-main">
            <div className="student-avatar">{initials || 'ST'}</div>
            <div style={{minWidth:0}}>
              <div className="student-name">{student.name}</div>
              <div className="student-meta"><span className="student-chip">{student.group}</span><span className="student-chip">{student.year}</span><span className="student-chip">{student.age} лет</span><span className="student-chip">{student.specialty}</span></div>
            </div>
          </div>
          <div><div className="student-marks-label">Оценки</div><div className="marks">{student.grades.length ? student.grades.map((value,index) => <span className={`mark ${value <= 2 ? 'low' : ''}`} key={`${student.id}-${index}`}>{value}</span>) : <span className="no-marks">Оценок пока нет</span>}</div></div>
          <div><div className="average-label">Средний балл</div><div className="average-number">{student.grades.length ? average.toFixed(2) : '—'}</div></div>
          <div className="student-actions">
            <select className="field grade-select" aria-label={`Оценка для ${student.name}`} value={grade} onChange={event => setGrade(event.target.value)}>{[5,4,3,2,1].map(value => <option key={value} value={value}>{value}</option>)}</select>
            <button className="btn btn-orange" onClick={() => onAddGrade(student.id,Number(grade))}>+ Оценка</button>
            <button className="icon-btn" title="Удалить студента" aria-label={`Удалить ${student.name}`} onClick={() => onRemove(student.id)}>✕</button>
          </div>
        </article>
      );
    }

    function App() {
      const [activeTab,setActiveTab] = useState('likes');
      const [selectedCourse,setSelectedCourse] = useState(languages[0]);
      const [students,setStudents] = useState(() => {
        const saved = safeRead('lab11-students', null);
        return Array.isArray(saved) ? saved : initialStudents;
      });
      const [studentForm,setStudentForm] = useState({ name:'', group:'', specialty:'', year:'1 курс', age:'18' });
      const [search,setSearch] = useState('');
      const [notice,setNotice] = useState('');

      useEffect(() => { localStorage.setItem('lab11-students',JSON.stringify(students)); },[students]);
      const allGrades = students.flatMap(student => student.grades || []);
      const classAverage = allGrades.length ? allGrades.reduce((sum,value) => sum + value,0) / allGrades.length : 0;
      const filteredStudents = useMemo(() => students.filter(student => `${student.name} ${student.group} ${student.specialty}`.toLowerCase().includes(search.toLowerCase())),[students,search]);
      const likesCount = Number(safeRead('lab11-likes',0)) || 0;

      function updateForm(field,value) { setStudentForm(current => ({...current,[field]:value})); }
      function addStudent(event) {
        event.preventDefault();
        const age = Number(studentForm.age);
        if (!studentForm.name.trim() || !studentForm.group.trim() || !studentForm.specialty.trim() || !Number.isInteger(age) || age < 14 || age > 100) {
          setNotice('Заполните имя, группу, специальность и корректный возраст (14–100).');
          return;
        }
        const newStudent = { id:Date.now(), name:studentForm.name.trim(), group:studentForm.group.trim(), specialty:studentForm.specialty.trim(), year:studentForm.year, age, grades:[] };
        setStudents(current => [newStudent,...current]);
        setStudentForm({name:'',group:'',specialty:'',year:'1 курс',age:'18'});
        setNotice(`Студент «${newStudent.name}» добавлен в журнал.`);
      }
      function addGrade(studentId,value) {
        if (!Number.isInteger(value) || value < 1 || value > 5) return;
        setStudents(current => current.map(student => student.id === studentId ? {...student,grades:[...student.grades,value]} : student));
        setNotice('Оценка добавлена. Средние баллы пересчитаны автоматически.');
      }
      function removeStudent(studentId) {
        setStudents(current => current.filter(student => student.id !== studentId));
        setNotice('Запись студента удалена.');
      }

      const tabs = [
        {id:'likes',number:'01',title:'Счётчик лайков'},
        {id:'courses',number:'02',title:'Языки программирования'},
        {id:'journal',number:'03',title:'Электронный журнал'}
      ];

      return (
        <main className="shell">
          <div className="topline">
            <div className="brand"><span className="brand-mark">⚛</span><span>Interactive React Lab</span></div>
            <div className="top-status"><span className="live-dot"></span> ПРИЛОЖЕНИЕ АКТИВНО</div>
          </div>

          <header className="hero">
            <div className="hero-content">
              <div className="eyebrow"><span className="eyebrow-line"></span> WEB DEVELOPMENT · LAB 11</div>
              <h1>React: <span>Props</span> & State</h1>
              <p className="hero-copy">Три интерактивных модуля в одном приложении. Изучаем передачу данных между компонентами, локальное состояние и обновление интерфейса без перезагрузки страницы.</p>
              <div className="hero-pills"><span className="pill"><strong>React 18</strong> · Components</span><span className="pill"><strong>useState</strong> · State</span><span className="pill"><strong>Props</strong> · Data flow</span><span className="pill">Адаптивный интерфейс</span></div>
            </div>
            <div className="hero-aside"><div><div className="hero-aside-label">Практических задания</div><div className="hero-aside-number">03</div></div><div className="hero-aside-note">Один проект · три сценария · единая логика компонентов React</div></div>
          </header>

          <section className="architecture" aria-label="Архитектура React">
            <div className="architecture-item"><div className="architecture-icon">P</div><div><div className="architecture-title">PROPS</div><div className="architecture-sub">Передача данных в компонент</div></div></div>
            <div className="architecture-item"><div className="architecture-icon">C</div><div><div className="architecture-title">COMPONENTS</div><div className="architecture-sub">Интерфейс из независимых блоков</div></div></div>
            <div className="architecture-item"><div className="architecture-icon">S</div><div><div className="architecture-title">STATE</div><div className="architecture-sub">Динамическое обновление UI</div></div></div>
          </section>

          <nav className="tabs" aria-label="Разделы лабораторной работы">
            {tabs.map(tab => <button key={tab.id} className={`tab ${activeTab === tab.id ? 'active' : ''}`} onClick={() => setActiveTab(tab.id)}><span className="tab-number">{tab.number}</span>{tab.title}</button>)}
          </nav>

          {activeTab === 'likes' && <section className="panel">
            <div className="section-head"><div><div className="section-kicker">Задание 01 / useState</div><h2>Счётчик лайков</h2><p className="section-description">Один большой интерактивный палец вверх. Компонент <code>LikeButton</code> получает подпись через props, а количество лайков хранит в собственном state.</p></div><span className="task-tag">♥ LikeButton</span></div>
            <LikeButton caption="Поддержи проект одним нажатием" />
            <div className="note"><span>↗</span><div><strong>Что демонстрирует задание:</strong> обработчик <code>onClick</code> вызывает функцию <code>setLikes</code>, React обновляет значение счётчика и перерисовывает компонент. Счётчик сохраняется в браузере после перезагрузки.</div></div>
          </section>}

          {activeTab === 'courses' && <section className="panel">
            <div className="section-head"><div><div className="section-kicker">Задание 02 / props + parent state</div><h2>Каталог языков программирования</h2><p className="section-description">Выбери технологию — справа появится её профиль, особенности, сферы применения и пример кода с анимацией. Карточка <code>CourseCard</code> получает данные через props, выбранный язык хранится в родителе <code>App</code>.</p></div><span className="task-tag">⌘ CourseCard</span></div>
            <div className="language-layout">
              <div className="language-grid">{languages.map(course => <CourseCard key={course.id} course={course} selected={selectedCourse.id === course.id} onSelect={setSelectedCourse} />)}</div>
              <CourseDetails course={selectedCourse} />
            </div>
            <div className="note"><span>✦</span><div><strong>Динамическая карточка:</strong> при выборе языка меняется состояние родительского компонента. React передаёт выбранный объект в <code>CourseDetails</code>, а анимация подчёркивает обновление информации.</div></div>
          </section>}

          {activeTab === 'journal' && <section className="panel">
            <div className="section-head"><div><div className="section-kicker" style={{color:'var(--orange)'}}>Задание 03 / student management</div><h2>Электронный журнал</h2><p className="section-description">Добавляй студентов с характеристиками, выставляй оценки и следи за средним баллом каждого студента и всей группы. Все изменения хранятся в state родителя.</p></div><span className="task-tag orange">▤ StudentRow</span></div>

            <div className="journal-stats">
              <div className="journal-stat"><div className="journal-stat-label">Студентов в журнале</div><div className="journal-stat-value">{students.length}</div></div>
              <div className="journal-stat"><div className="journal-stat-label">Выставлено оценок</div><div className="journal-stat-value">{allGrades.length}</div></div>
              <div className="journal-stat"><div className="journal-stat-label">Средний балл</div><div className="journal-stat-value">{allGrades.length ? classAverage.toFixed(2) : '—'}</div></div>
              <div className="journal-stat"><div className="journal-stat-label">Учебных групп</div><div className="journal-stat-value">{new Set(students.map(student => student.group)).size}</div></div>
            </div>

            <form className="add-student" onSubmit={addStudent}>
              <div className="add-student-head"><h3><span className="add-plus">+</span> Добавить нового студента</h3><span className="task-tag orange">Новая запись</span></div>
              <div className="form-grid">
                <label className="field-wrap"><span className="field-label">ФИО студента</span><input className="field" placeholder="Например, Иван Петров" value={studentForm.name} onChange={event => updateForm('name',event.target.value)} maxLength="70" /></label>
                <label className="field-wrap"><span className="field-label">Группа</span><input className="field" placeholder="ПО-23" value={studentForm.group} onChange={event => updateForm('group',event.target.value)} maxLength="20" /></label>
                <label className="field-wrap"><span className="field-label">Специальность</span><input className="field" placeholder="Информационные системы" value={studentForm.specialty} onChange={event => updateForm('specialty',event.target.value)} maxLength="60" /></label>
                <label className="field-wrap"><span className="field-label">Возраст</span><input className="field" type="number" min="14" max="100" value={studentForm.age} onChange={event => updateForm('age',event.target.value)} /></label>
                <label className="field-wrap"><span className="field-label">Курс обучения</span><select className="field" value={studentForm.year} onChange={event => updateForm('year',event.target.value)}>{['1 курс','2 курс','3 курс','4 курс','5 курс'].map(value => <option key={value}>{value}</option>)}</select></label>
                <button className="btn btn-orange form-submit" type="submit">＋ Добавить в журнал</button>
              </div>
            </form>

            <div className="journal-toolbar"><div><h3>Список студентов</h3><div className="muted small" style={{marginTop:4}}>Нажми «+ Оценка», чтобы пересчитать средние значения</div></div><input className="field search-field" placeholder="⌕ Поиск по имени, группе или специальности" value={search} onChange={event => setSearch(event.target.value)} /></div>
            <div className="student-list">
              {filteredStudents.length ? filteredStudents.map(student => <StudentRow key={student.id} student={student} onAddGrade={addGrade} onRemove={removeStudent} />) : <div className="empty">Студенты не найдены. Измени запрос или добавь новую запись.</div>}
            </div>
            {notice && <div className="note" role="status"><span>✓</span><div>{notice}</div><button className="icon-btn" style={{marginLeft:'auto',flexShrink:0}} onClick={() => setNotice('')} aria-label="Закрыть сообщение">✕</button></div>}
            <div className="note"><span>↗</span><div><strong>Логика данных:</strong> <code>StudentRow</code> получает объект студента через props. Родительский компонент <code>App</code> хранит массив студентов и оценки, поэтому средний балл и статистика автоматически пересчитываются после каждого изменения. Данные сохраняются в localStorage.</div></div>
          </section>}

          <footer className="footer"><span><strong>Лабораторная работа №11</strong> · React Props & State</span><span>Компонентный подход · Управление состоянием · 2026</span></footer>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
